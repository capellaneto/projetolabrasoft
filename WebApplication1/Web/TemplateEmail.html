<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">

    <title>Nova Despesa</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
        }

        h1 {
            color: #333;
        }

        .informacao {
            margin: 15px 0;
        }

        .label {
            font-weight: bold;
        }

        .valor {
            color: #555;
        }

        .despesa {
            background-color: #f8f8f8;
            padding: 20px;
            border-radius: 8px;
            margin-top: 20px;
        }

        .rodape {
            margin-top: 30px;
            font-size: 12px;
            color: #777;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Nova despesa cadastrada:</h1>

        <p>
            Olá, <strong>{{NOME_USUARIO}}</strong>.
        </p>

        <p>
            Uma nova despesa foi cadastrada.
        </p>

        <div class="despesa">

            <div class="informacao">
                <span class="label">Descrição:</span>
                <span class="valor">{{DESCRICAO}}</span>
            </div>

            <div class="informacao">
                <span class="label">Valor:</span>
                <span class="valor">R$ {{VALOR}}</span>
            </div>

            <div class="informacao">
                <span class="label">Data:</span>
                <span class="valor">{{DATA_DESPESA}}</span>
            </div>

            <div class="informacao">
                <span class="label">Coordenador responsável:</span>
                <span class="valor">{{COORDENADOR}}</span>
            </div>

        </div>  

        <div class="rodape">
            Este é um e-mail automático enviado pelo sistema.
        </div>

    </div>

</body>
</html>
