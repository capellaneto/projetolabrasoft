<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Fundação - Cadastro de Bolsista</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .custom-select {
            border-radius: 10px;
            border: 2px solid #dee2e6;
            padding: 10px;
            transition: all 0.3s ease;
        }

            .custom-select:focus {
                border-color: #198754;
                box-shadow: 0 0 0 0.25rem rgba(25, 135, 84, 0.25);
            }
    </style>
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h2 class="mb-0">Cadastro de Bolsista</h2>
            </div>
            <div class="card-body">
                <form>
                    <div class="mb-3">
                        <label class="form-label">Nome Completo:</label>
                        <input type="text" class="form-control" placeholder="Digite o nome">
                    </div> 
                    <div class="mb-3">
                        <label class="form-label">CPF:</label>
                        <input type="text" class="form-control" placeholder="Digite seu CPF">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Matricula:</label>
                        <input type="text" class="form-control" placeholder="Digite sua matricula" />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Data de Nascimento:</label>
                        <input type="date" class="form-control" placeholder="Digite sua data de nascimento" />
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Sexo:</label>
                        <select  class="form-select custom-select">
                            <option value="M">
                                masculino
                            </option>
                            <option value="F">
                                feminino
                            </option>
                            <option value="O">
                                outro
                            </option>
                        </select>
                    </div>

                    <hr />
                    <button type="button" class="btn btn-success">Salvar (Semana 1: Visual)</button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
